spring.config.import=optional:file:./.env[.properties]
spring.application.name=CapituLando

spring.datasource.url=${NEON_JDBC_URL:${DATABASE_URL:${SPRING_DATASOURCE_URL:}}}
spring.datasource.username=${NEON_DB_USERNAME:${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:}}}
spring.datasource.password=${NEON_DB_PASSWORD:${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=false

app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.mail.from=${MAIL_FROM:${GMAIL_USERNAME:}}
app.jwt.secret-base64=${APP_JWT_SECRET_BASE64:}
app.jwt.issuer=${APP_JWT_ISSUER:capitulando-api}
app.jwt.access-token-ttl=${APP_JWT_ACCESS_TOKEN_TTL:PT1H}
app.auth.email-verification-ttl=${APP_AUTH_EMAIL_VERIFICATION_TTL:PT24H}
app.auth.password-reset-ttl=${APP_AUTH_PASSWORD_RESET_TTL:PT1H}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=5000
