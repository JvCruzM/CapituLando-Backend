spring.application.name=CapituLando

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.mail.from=${MAIL_FROM:${GMAIL_USERNAME:}}
app.jwt.secret-base64=${APP_JWT_SECRET_BASE64:}
app.jwt.issuer=${APP_JWT_ISSUER:capitulando-api}
app.jwt.access-token-ttl=${APP_JWT_ACCESS_TOKEN_TTL:PT1H}
app.auth.email-verification-ttl=${APP_AUTH_EMAIL_VERIFICATION_TTL:PT24H}
app.auth.password-reset-ttl=${APP_AUTH_PASSWORD_RESET_TTL:PT1H}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=5000
